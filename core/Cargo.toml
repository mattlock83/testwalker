[package]
default-run = "testwalker"
name = "testwalker-core"
version = "4.0.0"
edition = "2024"
rust-version = "1.88"
description = "Target-independent graph and property testing with a JSON-RPC adapter boundary"

[dependencies]
graphwalker-core = { git = "https://github.com/GraphWalker/graphwalker-rs.git", rev = "21e6b7d72c3daab26d9cd6a1dff899275e411b23" }
graphwalker-dsl = { git = "https://github.com/GraphWalker/graphwalker-rs.git", rev = "21e6b7d72c3daab26d9cd6a1dff899275e411b23" }
graphwalker-io = { git = "https://github.com/GraphWalker/graphwalker-rs.git", rev = "21e6b7d72c3daab26d9cd6a1dff899275e411b23" }
hegel = { package = "hegeltest", git = "https://github.com/hegeldev/hegel-rust.git", rev = "33d94c659e441127ce7b5a0f046ec4aa9315d794", features = ["static-engine"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rust_decimal = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }

# A Rust subprocess fixture; it is not distributed in browser wheels.
[[bin]]
name = "testwalker-rpc-test-peer"
path = "tests/support/rpc_peer.rs"
test = false
doc = false

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = true
